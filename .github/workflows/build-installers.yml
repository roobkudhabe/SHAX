name: Build SHAX installers

on:
  push:
    branches: [main]
    paths:
      - 'CSXS/**'
      - 'css/**'
      - 'js/**'
      - 'jsx/**'
      - 'index.html'
      - 'packaging/**'
      - '.github/workflows/build-installers.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shax-distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate CEP project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify manifest and sources
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          required = ('index.html','CSXS/manifest.xml','css/style.css','js/app.js','jsx/host.jsx')
          for name in required:
              p = Path(name)
              assert p.is_file() and p.stat().st_size > 100, f'Missing or empty runtime file: {p}'
          manifest = ET.parse('CSXS/manifest.xml').getroot()
          assert manifest.attrib.get('ExtensionBundleVersion') == '3.4.0'
          assert 'com.shax.panel' in Path('CSXS/manifest.xml').read_text()
          print('SHAX runtime validation: OK')
          PY
          node --check js/app.js
          bash -n packaging/macos/build-macos.sh
          bash -n packaging/macos/scripts/postinstall

  macos:
    name: macOS .pkg
    runs-on: macos-15
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Build native Apple Installer package
        run: bash packaging/macos/build-macos.sh
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: SHAX-macOS-v3.4.0
          path: dist/SHAX-v3.4.0-macOS.pkg
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows .exe
    runs-on: windows-2022
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Install NSIS compiler
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Build native Windows Setup wizard
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path $compiler)) {
            $compiler = (Get-Command makensis.exe -ErrorAction Stop).Source
          }
          & $compiler /V3 'packaging\windows\SHAX.nsi'
          if ($LASTEXITCODE -ne 0) { throw "NSIS compiler failed: $LASTEXITCODE" }
          $exe = 'dist\SHAX-Setup-v3.4.0.exe'
          if (-not (Test-Path $exe)) { throw "Installer missing: $exe" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw 'Invalid Windows executable signature' }
          Write-Host "Created $exe ($($bytes.Length) bytes)"
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SHAX-Windows-v3.4.0
          path: dist/SHAX-Setup-v3.4.0.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish preview downloads
    runs-on: ubuntu-latest
    needs: [macos, windows]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch both installers
        uses: actions/download-artifact@v4
        with:
          pattern: SHAX-*-v3.4.0
          path: dist
          merge-multiple: true
      - name: Verify files and generate checksums
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = (Path('dist/SHAX-v3.4.0-macOS.pkg'), Path('dist/SHAX-Setup-v3.4.0.exe'))
          for file in files:
              assert file.is_file() and file.stat().st_size > 10000, f'Invalid installer: {file}'
          assert files[0].read_bytes()[:4] == b'xar!', 'Invalid macOS package header'
          assert files[1].read_bytes()[:2] == b'MZ', 'Invalid Windows EXE header'
          print('Installer archive signatures: OK')
          PY
          cd dist && sha256sum SHAX-v3.4.0-macOS.pkg SHAX-Setup-v3.4.0.exe > SHA256SUMS.txt
      - name: Create or refresh GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v3.4.0-beta.1'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/SHAX-v3.4.0-macOS.pkg dist/SHAX-Setup-v3.4.0.exe dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" \
              dist/SHAX-v3.4.0-macOS.pkg \
              dist/SHAX-Setup-v3.4.0.exe \
              dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title 'SHAX v3.4.0 | Installer Preview' \
              --notes-file packaging/RELEASE_NOTES.md \
              --prerelease
          fi